<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved offline walks · TownshipGo</title>
<style>body{font:18px/1.5 system-ui;background:#f6f7f2;color:#24392f;max-width:48rem;margin:auto;padding:1rem;overflow-wrap:anywhere}h1,h2{line-height:1.2}button,a{font:inherit;min-height:44px;margin:.3rem 0}button{padding:.6rem 1rem;border:2px solid #697f6d;border-radius:12px;background:white;color:#24392f;cursor:pointer;text-align:left}li,section{border:1px solid #ccd6cd;padding:1rem;background:white;border-radius:12px;margin:.6rem 0}svg{width:100%;height:auto;background:#e9eee6}small{display:block}.notice{padding:1rem;background:#fff4cd;border-radius:12px}a{color:#7f1d22}nav{display:flex;flex-wrap:wrap;gap:1rem}</style>
<main><p>TownshipGo · saved on this device</p><h1>Your offline walks</h1><p class="notice">These are saved snapshots. Recheck conditions before setting out. Street-map tiles, live weather and shared updates are unavailable offline.</p><nav><a id="back" href="./resident/">Return to planner (online)</a><button id="list" type="button" hidden>All saved walks</button></nav><div id="content" aria-live="polite"></div></main>
<script>
(() => {
    const content = document.getElementById('content'), list = document.getElementById('list');
    const element = (tag,text,parent) => { const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e; };
    let packs=[];
    try { packs=JSON.parse(localStorage.getItem('townshipgo:walk-library:v1')||'{"packs":[]}').packs; if(!Array.isArray(packs))packs=[]; }catch{element('p','Saved data could not be read in this browser.',content);}
    function showList(){content.replaceChildren();list.hidden=true;if(!packs.length)element('p','No walks are saved on this device. Save a walk in the planner while online, or open a downloaded walk pack.',content);
        for(const p of packs){if(!p.route||!Array.isArray(p.route.coordinates))continue;const section=element('section',undefined,content);const b=element('button',p.title,section);b.onclick=()=>show(p);element('small','Saved '+p.saved_at,section);}}
    function show(p){content.replaceChildren();list.hidden=false;element('h2',p.title,content);element('p',Math.ceil(p.route.total_min)+' min estimated · '+Math.round(p.route.length_m)+' m · '+p.route.rest_min+' min planned rest',content);element('p','Saved '+p.saved_at+' · condition data loaded '+p.data_at+' · network snapshot '+(p.network_snapshot_at||'date not provided'),content);
        const points=p.route.coordinates.filter(v=>Array.isArray(v)&&v.length===2&&v.every(Number.isFinite));
        if(points.length){const cos=Math.cos(points[0][0]*Math.PI/180),xs=points.map(v=>v[1]*cos),ys=points.map(v=>-v[0]),minX=Math.min(...xs),minY=Math.min(...ys),scale=Math.min(560/(Math.max(...xs)-minX||1),300/(Math.max(...ys)-minY||1));const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 600 340');svg.setAttribute('role','img');svg.setAttribute('aria-label','Saved route sketch, north is up');const line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('points',points.map((_,i)=>(20+(xs[i]-minX)*scale)+','+(20+(ys[i]-minY)*scale)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#a4262c');line.setAttribute('stroke-width','5');svg.append(line);content.append(svg);}
        element('p','Route sketch · north is up · walking network © OpenStreetMap contributors, ODbL.',content);
        element('h3','Along your walk',content);const ol=element('ol',undefined,content);for(const s of p.route.steps||[]){const li=element('li',s.name,ol);element('small',Math.round(s.start_min)+'–'+Math.ceil(s.end_min)+' min · '+Math.round(s.distance_m)+' m · '+s.kind,li);const edge=(p.edges||[]).find(e=>e.id===s.edge_id);if(edge)element('small',(edge.is_crossing?'Crossing · ':'')+(edge.covered===true?'Mapped roof cover':edge.covered===false?'Mapped without roof cover':'Roof cover unknown')+(edge.slope_pct===null?' · slope unknown':' · mapped slope '+edge.slope_pct+'%'),li);}
        element('h3',p.route.return_walk?'Return to your starting point':'Arrival: '+p.route.entrance.name,content);
        element('h3','Nearby mapped facilities',content);if(!(p.facilities||[]).length)element('p','No nearby facilities are mapped in this pack.',content);for(const a of p.facilities||[]){element('p',a.name+' · '+a.kind+' · availability needs checking',content);}
        element('h3','Saved condition records',content);if(!(p.checks||[]).length)element('p','No field observations were saved. Conditions need confirmation.',content);for(const c of p.checks||[]){const section=element('section',undefined,content);element('strong',c.target_type+' '+c.target_id+' · '+c.status+(c.valid_until&&Date.parse(c.valid_until)<=Date.now()?' · review overdue':''),section);element('small','Observed '+c.observed_at+' · review due '+(c.valid_until||'not recorded'),section);element('p',Object.entries(c.attributes||{}).map(([k,v])=>k.replaceAll('_',' ')+': '+v).join('; '),section);}
        window.scrollTo(0,0);
    }
    list.onclick=showList;showList();
})();
</script></html>
