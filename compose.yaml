name: townshipgo

services:
  db:
    image: postgis/postgis:17-3.5
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    environment:
      POSTGRES_DB: township
      POSTGRES_USER: township
      # Local development only; bind the database to loopback.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-township_local}
    volumes:
      - township_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U township -d township"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  township_postgres:
